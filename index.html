<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobby's Plays</title>
<style>
  :root {
    --bg: #1E1F22;
    --panel: #26282D;
    --panel-2: #2F3237;
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .16);
    --text: #FFFFFF;
    --muted: #A3A7AF;
    --orange: #DC4405;
    --orange-soft: rgba(220, 68, 5, .14);
    --win: #2EBD59;
    --loss: #E5484D;
    --push: #8B8D93;
    --live: #F5A524;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--orange); }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 56px; }

  header { text-align: center; padding: 36px 0 14px; }
  header h1 { margin: 0; font-size: clamp(36px, 7.5vw, 56px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  header h1::after { content: ""; display: block; width: 44px; height: 4px; border-radius: 2px;
                     background: var(--orange); margin: 12px auto 0; }
  header .updated { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* Main tabs: one segmented control that stays in reach while scrolling */
  nav { position: sticky; top: 8px; z-index: 5; display: flex; gap: 2px; width: fit-content; max-width: 100%;
        margin: 10px auto 26px; padding: 4px; border-radius: 999px; border: 1px solid var(--line);
        background: rgba(38, 40, 45, .82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, .28); }
  nav button { background: transparent; color: var(--muted); border: 0; border-radius: 999px; padding: 8px 16px;
               font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: color .15s, background .15s; }
  nav button:hover { color: var(--text); }
  nav button.active { background: var(--orange); color: #fff; }
  @media (max-width: 380px) { nav button { padding: 8px 12px; } }

  h2 { color: var(--text); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 28px 0 14px; }
  h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--orange); font-size: 13px; font-weight: 800;
       letter-spacing: .08em; text-transform: uppercase; margin: 28px 0 10px; }
  h3 .count { color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 1px 8px;
              font-size: 12px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  h3 .day-rec, h3 .day-u { letter-spacing: 0; text-transform: none; font-size: 14px; font-variant-numeric: tabular-nums; }
  h3 .day-rec { color: var(--text); }
  .note { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
  .empty { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 28px;
           text-align: center; color: var(--muted); }

  /* Sport filter */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
  .filters button { background: transparent; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px;
                    padding: 5px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
                    transition: color .15s, border-color .15s, background .15s; }
  .filters button span { opacity: .7; font-weight: 500; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .filters button:hover { color: var(--text); border-color: var(--orange); }
  .filters button.active { background: var(--text); border-color: var(--text); color: var(--bg); }

  /* Game cards */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 641px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line);
          transition: border-color .15s, transform .15s; }
  @media (hover: hover) { .card:hover { border-color: var(--line-2); transform: translateY(-1px); } }
  .card-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 4px;
              font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .sport { color: var(--muted); }
  .status { color: var(--muted); display: inline-flex; align-items: center; }
  .status.live { color: var(--live); }
  .status.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live);
                         margin-right: 6px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .badge { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 999px; margin-left: 6px;
           text-align: center; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
  .badge.W { background: var(--win); } .badge.L { background: var(--loss); } .badge.P { background: var(--push); }
  .team { display: flex; align-items: center; gap: 12px; padding: 9px 14px; position: relative; }
  .team.picked { background: var(--orange-soft); }
  .team.picked::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
                         border-radius: 0 3px 3px 0; background: var(--orange); }
  .logo { width: 34px; height: 34px; flex: none; object-fit: contain; }
  .abbr-circle { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--panel-2);
                 border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 10px; font-weight: 800; }
  .tname { flex: 1; min-width: 0; line-height: 1.25; }
  .tname b { display: block; font-size: 15px; }
  .tname b .rank { display: inline; color: var(--orange); font-size: 12px; font-weight: 800; margin-right: 5px; }
  .tname span { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; letter-spacing: -0.02em; }
  .score.W { color: var(--win); } .score.L { color: var(--loss); } .score.P { color: var(--push); }
  .card-pick { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px;
               padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 700;
               letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .card-pick b { color: var(--text); font-size: 14px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

  /* Parlays */
  .parlays { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 641px) { .parlays { grid-template-columns: 1fr 1fr; } }
  .parlay { background: linear-gradient(180deg, var(--orange-soft), transparent 90px), var(--panel);
            border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .parlay-top { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 14px 2px; }
  .parlay-top b { font-size: 15px; }
  .parlay-odds { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .parlay-sub { padding: 0 14px 10px; color: var(--muted); font-size: 12px; }
  .leg { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px;
         border-top: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
  .leg .sp { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .06em; margin-right: 8px; }
  .leg .st { color: var(--muted); white-space: nowrap; font-size: 12px; }

  /* Record */
  .big { background: linear-gradient(180deg, var(--orange-soft), transparent 120px), var(--panel);
         border: 1px solid var(--line); border-radius: var(--r); padding: 26px 20px; text-align: center; }
  .big .rec { font-size: clamp(40px, 9vw, 56px); font-weight: 800; font-variant-numeric: tabular-nums;
              letter-spacing: -0.03em; line-height: 1.05; }
  .big .sub { color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .pos { color: var(--win); } .neg { color: var(--loss); } .zero { color: var(--push); }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  tbody tr:last-child td { border-bottom: 0; }
  @media (hover: hover) { tbody tr:hover td { background: rgba(255, 255, 255, .025); } }
  td.num, th.num { text-align: right; }
  @media (max-width: 480px) { table { font-size: 13px; } th, td { padding: 9px 8px; white-space: nowrap; }
                              th:first-child, td:first-child { padding-left: 12px; } }
  .res { font-weight: 800; }
  .res.W { color: var(--win); } .res.L { color: var(--loss); } .res.P, .res.pending { color: var(--push); }

  section[hidden] { display: none; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 48px; }

  /* Learning */
  .lead { color: var(--muted); max-width: 760px; margin: 0 0 16px; }
  .steps { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 641px) { .steps { grid-template-columns: 1fr 1fr; } }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .step .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
               background: var(--orange); font-weight: 800; font-size: 13px; margin-right: 8px; }
  .step b { font-size: 15px; }
  .step p { color: var(--muted); margin: 8px 0 0; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 10px; text-align: center; }
  .tile .v { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { position: relative; height: 8px; background: var(--panel-2); border-radius: 4px; min-width: 80px; }
  .bar span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
  .bar .exp { background: var(--push); opacity: .6; }
  .bar .act { background: var(--orange); height: 4px; top: 2px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px; }
  .list .item { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .list .item:last-child { border-bottom: 0; }
  .list .item small { display: block; color: var(--muted); margin-top: 4px; font-size: 13px; }
  .when { color: var(--orange); font-weight: 700; font-size: 12px; margin-right: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtOdds = o => { const n = Number(o); return o === "" || isNaN(n) ? "" : (n > 0 ? "+" : MINUS) + Math.abs(n); };
const fmtLine = l => { const n = Number(l); return n === 0 ? "PK" : (n > 0 ? "+" : MINUS) + Math.abs(n); };
const fmtUnits = u => signed(u, 2) + "u";
const unitClass = u => u > 0 ? "pos" : u < 0 ? "neg" : "zero";

function pickTeam(p) {
  const side = p.pick_side === "home" ? "home" : "away", rank = p[side + "_rank"];
  return (rank ? `#${rank} ` : "") + (p[side + "_abbr"] || p[side]);
}
function pickLabel(p) {
  const t = esc(pickTeam(p));
  if (p.market === "spread") return `${t} ${fmtLine(p.line)} (${fmtOdds(p.odds)})`;
  return `${t} ML ${fmtOdds(p.odds)}`;
}
function unitsFor(result, odds) {
  if (result === "L") return -1;
  if (result === "P") return 0;
  if (result === "W") { const o = Number(odds); return o > 0 ? o / 100 : 100 / Math.abs(o); }
  return null;
}
// Grade from a final score. Only used for display until the nightly grade fills the ledger.
function gradeFromScore(p, away, home) {
  const mine = p.pick_side === "home" ? home : away, theirs = p.pick_side === "home" ? away : home;
  const margin = mine - theirs + (p.market === "spread" ? Number(p.line) : 0);
  return margin > 0 ? "W" : margin < 0 ? "L" : "P";
}
function ptTime(iso) {

function tally(list) {
  const t = { W: 0, L: 0, P: 0, units: 0, graded: 0 };
  for (const p of list) {
    if (!["W", "L", "P"].includes(p.result)) continue;
    t[p.result]++; t.graded++;
    t.units += p.units !== "" ? Number(p.units) : unitsFor(p.result, p.odds);
  }
  t.roi = t.graded ? t.units / t.graded * 100 : 0;

/* ---------- Games ---------- */
function teamRow(p, side, info, result) {
  const name = p[side], abbr = p[side + "_abbr"] || name.slice(0, 3).toUpperCase();
  const logo = info?.[side]?.logo || p[side + "_logo"];
  const img = logo
    ? `<img class="logo" src="${esc(logo)}" alt="" onerror="this.outerHTML='<div class=&quot;abbr-circle&quot;>${esc(abbr)}</div>'">`
    : `<div class="abbr-circle">${esc(abbr)}</div>`;
  const score = info && info.state !== "pre" ? info[side].score : "";
  const scoreCls = info?.state === "post" && result ? result : "";
  return `<div class="team${p.pick_side === side ? " picked" : ""}">${img}
    <div class="tname"><b>${p[side + "_rank"] ? `<span class="rank">#${esc(p[side + "_rank"])}</span>` : ""}${esc(abbr)}</b><span>${esc(name)}</span></div>
    <div class="score ${scoreCls}">${esc(score)}</div></div>`;
}
function card(p) {
  const info = live[p.espn_event_id];
  let status, result = p.result;
  if (info?.state === "in") {
    status = `<span class="status live">LIVE · ${esc(info.detail)}</span>`;
  } else if (info?.state === "post" || result) {
    if (!result && info) result = gradeFromScore(p, Number(info.away.score), Number(info.home.score));
    status = `<span class="status">FINAL${result ? `<span class="badge ${result}">${result}</span>` : ""}</span>`;
  } else {
    status = `<span class="status">NOT STARTED · ${esc(ptTime(p.start_utc))}</span>`;
  }
  return `<div class="card">
    <div class="card-top"><span class="sport">${esc(p.sport)}</span>${status}</div>
    ${teamRow(p, "away", info, result)}
    ${teamRow(p, "home", info, result)}
    <div class="card-pick">Pick <b>${pickLabel(p)}</b></div></div>`;
}
const byStart = (a, b) => (a.start_utc || "").localeCompare(b.start_utc || "");
// One heading and grid per sport, fewest games on top (ties keep the site's sport order).
function bySport(list) {
  return D.sports
    .map(s => list.filter(p => p.sport === s).sort(byStart))
    .filter(games => games.length)
    .sort((a, b) => a.length - b.length)
    .map(games => `<h3>${games[0].sport} <span class="count">${games.length}</span></h3><div class="grid">${games.map(card).join("")}</div>`)

  const byKey = Object.fromEntries(D.picks.map(p => [p.key, p]));
  const list = (D.parlays || []).filter(x => x.legs.every(k => byKey[k]));
  if (!list.length) return "";
  return `<h3>Parlays of the day</h3><div class="parlays">` + list.map(x => {
    const legs = x.legs.map(k => byKey[k]), res = legs.map(legResult);
    const status = res.includes("L") ? `<span class="badge L">MISS</span>`
      : res.every(r => r === "W" || r === "P") ? `<span class="badge W">HIT</span>` : "";

/* ---------- Learning ---------- */
const KNOB_TITLES = {
  sd: "Re-measured how far real results land from our numbers",
  espn_conv: "Re-tuned how we turn ESPN's win chances into point margins",
  shrink_over_7: "Stopped shading big favorites",
  cbb_shrink_over_20: "Stopped shading big favorites",
  injury_weight: "Rebalanced trust between our injury read and the market",
  injury_weight_by_sport: "Leaned more on the market for one sport",
  cbb_spread_underdog: "College basketball spread picks take the underdog",
  college_ml_to_1000: "College picks stay on the moneyline more often",
};
function watchLabel(w) {
  const n = w.name;
  if (w.kind === "flip") return "Picks switched to the underdog's spread";
  if (w.kind === "-400 switch") return n === "switched" ? "Big favorites moved from moneyline to spread" : "Picks kept on the moneyline";
  if (w.kind === "inputs") return n === "agree" ? "Games where our injury read and the market agreed" : "Games where they disagreed";
  if (w.kind === "sport") return `All ${n} picks`;
  if (w.kind === "sport+market") return `${n.replace(" ML", " moneyline")} picks`;
  if (w.kind === "spread size") {
    const [sport, size, role] = n.split(" ");
    return `${sport} ${role === "dog" ? "underdogs getting" : "favorites giving"} ${size} points`;
  }
  if (w.kind === "ML price") return `Moneyline picks: ${n.replace("fav", "favorites").replace("-", MINUS)}`;
  return `${w.kind}: ${n}`;
}
const pct = x => (100 * x).toFixed(0) + "%";
function calibRow(label, list) {
  const dec = list.filter(g => g.result !== "P");
  if (!dec.length) return "";
  const exp = dec.reduce((a, g) => a + g.prob, 0) / dec.length;
  const act = dec.filter(g => g.result === "W").length / dec.length;
  return `<tr><td>${esc(label)}</td><td class="num">${list.length}</td><td class="num">${pct(exp)}</td>
    <td class="num ${act >= exp - 0.03 ? "pos" : "neg"}">${pct(act)}</td>
    <td><div class="bar"><span class="exp" style="width:${100 * exp}%"></span><span class="act" style="width:${100 * act}%"></span></div></td></tr>`;
}
function renderLearning() {
  const L = D.learning || { graded: [], changes: [], watch: [] };
  const g = L.graded, dec = g.filter(x => x.result !== "P");
  const exp = dec.length ? dec.reduce((a, x) => a + x.prob, 0) / dec.length : 0;
  const act = dec.length ? dec.filter(x => x.result === "W").length / dec.length : 0;
  let h = `<h2>How we get better</h2>
  <p class="lead">Every game gets a pick, and every pick is a test. Before each game we save the exact chance our
  model gives the pick. The next morning we grade it and compare what we expected with what happened. When a
  pattern holds up beyond normal luck, the model changes, and every change is listed on this page.</p>
  <div class="steps">
    <div class="step"><span class="num">1</span><b>Write it down</b><p>At the 8:00 AM freeze we save the chance we
      gave every pick and what went into it: ESPN's matchup numbers, our own team ratings, injuries and the market price.</p></div>
    <div class="step"><span class="num">2</span><b>Grade it</b><p>Every morning, final scores grade every pick
      and the results go on the record. Nothing frozen is ever changed after the fact.</p></div>
    <div class="step"><span class="num">3</span><b>Separate luck from a real problem</b><p>We compare expected vs
      actual by sport, bet type, price and spread size. One bad night is luck; a pattern needs 20+ picks and a miss
      well beyond normal swings before we act on it.</p></div>
    <div class="step"><span class="num">4</span><b>Fix it in small steps</b><p>Model settings adjust automatically,
      a small step at a time, and are re-checked only on new picks. Bigger rule changes get a human decision.</p></div>
  </div>`;

  h += `<h2>Are our numbers honest?</h2>
  <p class="lead">If our chances are right, picks we call 60% should win about 60% of the time. Gray is what we
  expected, orange is what happened.</p>`;
  if (!g.length) h += `<div class="empty">No graded picks yet.</div>`;
  else {
    h += `<div class="tiles"><div class="tile"><div class="v">${g.length}</div><div class="k">picks graded</div></div>
      <div class="tile"><div class="v">${pct(exp)}</div><div class="k">we expected to hit</div></div>
      <div class="tile"><div class="v ${act >= exp - 0.03 ? "pos" : "neg"}">${pct(act)}</div><div class="k">actually hit</div></div></div>`;
    h += `<h3>By sport and bet type</h3><div class="tbl-wrap"><table><thead><tr><th>Group</th><th class="num">Picks</th>
      <th class="num">Expected</th><th class="num">Actual</th><th></th></tr></thead><tbody>`;
    for (const s of D.sports) {
      const sl = g.filter(x => x.sport === s);
      if (!sl.length) continue;
      h += calibRow(s, sl);
      for (const m of ["ML", "spread"]) {
        const ml = sl.filter(x => x.market === m);
        if (ml.length && ml.length < sl.length) h += calibRow(`${s} ${m === "ML" ? "moneyline" : "spread"}`, ml);
      }
    }
    h += calibRow("Switched to the underdog", g.filter(x => x.flip));
    h += `</tbody></table></div>`;
  }

  h += `<h2>What we're watching</h2>`;
  h += L.watch.length
    ? `<div class="list">${L.watch.map(w => `<div class="item">${esc(watchLabel(w))}: hit ${pct(w.act)} vs ${pct(w.pred)} expected
        over ${w.n} picks <span class="${unitClass(w.units)}">(${fmtUnits(w.units)})</span>
        <small>Flagged because the miss is bigger than luck explains. It stays here until new picks show it's fixed.</small></div>`).join("")}</div>`
    : `<div class="empty">Nothing flagged. No group of picks is missing by more than luck explains.</div>`;

  h += `<h2>Changes we've made</h2>`;
  const ch = L.changes.slice().reverse();
  h += ch.length
    ? `<div class="list">${ch.map(c => {
        const refit = /refit on (\d+) games/.exec(c.why);
        const plain = c.why.replace(/\s*\(sd_for\)/g, "").replace(/(\d+) g\b/g, "$1 games")
          .replace(/\bSD ([\d.]+)/g, "about $1 points").replace(/\bSD\b/g, "typical miss")
          .replace(/ pts? /g, " points ").replace(/~/g, "about ")
          .replace(/\s*\(Brier[^)]*\)/g, "").replace(/\bMODEL\b/g, "The market").replace(/\bINJURY weight\b/g, "our ratings' weight")
          .replace(/\bINJURY\b/g, "our ratings").replace(/\s*->\s*/g, " → ").replace(/(^|[\s(])-(\d)/g, "$1" + MINUS + "$2");
        const why = c.knob === "espn_conv" && refit ? `${c.why.split(" ")[0]}: refit on ${refit[1]} games.` : plain;
        return `<div class="item"><span class="when">${niceDate(c.date)}</span>${esc(KNOB_TITLES[c.knob] || c.knob)}<small>${esc(why)}</small></div>`;
      }).join("")}</div>`
    : `<div class="empty">No changes yet.</div>`;

  h += `<h2>What last season taught us</h2>
  <div class="list">
    <div class="item">Favorites covered about half the time at every spread size, even 30-point college basketball favorites.
      <small>5,287 games from 2025-26. Closing spreads were honest, so we no longer shade big favorites, and we lean on the market more for spreads.</small></div>
    <div class="item">Results land about 11 to 14 points from the spread, depending on the sport.
      <small>College basketball 11.3 (wider in blowouts), NFL 12.3, NBA 13.9, college football 15.0. We use these to turn a projected margin into a cover chance.</small></div>
    <div class="item">The market is hard to beat by much.
      <small>Honest edges are small. A cover chance of 80-90% almost always means our number is wrong, not that we found a gift.</small></div>
  </div>

  <h2>Picks vs bets</h2>
  <p class="lead">Every game gets a pick for the record, at 1 unit each. A bet is stricter: our chance has to beat the
  price by a set margin (3% to 6.5% depending on the bet), and the sharpest market's price has to agree. When it doesn't
  clear, it isn't a bet. We'd rather pass than force one.</p>`;
  document.getElementById("learning").innerHTML = h;
}

/* ---------- Live scores (ESPN, every 45s) ---------- */
async function poll() {
  const today = D.picks.filter(p => p.date === D.today && p.espn_event_id);
  const open = today.filter(p => live[p.espn_event_id]?.state !== "post" && !p.result);
  if (!open.length && Object.keys(live).length) return;
  const jobs = [...new Set(today.map(p => p.sport + "|" + p.date))];
  const byEvent = Object.fromEntries(today.map(p => [p.espn_event_id, p]));
  await Promise.all(jobs.map(async job => {
    const [sport, d] = job.split("|");
    if (!ESPN[sport]) return;
    const url = `https://site.api.espn.com/apis/site/v2/sports/${ESPN[sport]}/scoreboard?dates=${d.replace(/-/g, "")}&limit=300${GROUPS[sport] || ""}`;
    try {
      const res = await fetch(url);
      if (!res.ok) return;
      for (const ev of (await res.json()).events || []) {
        const comp = ev.competitions?.[0];
        if (!comp) continue;
        // Match each side to OUR pick's team by name, then abbreviation; the feed's own
        // home/away label is only the fallback (it can swap on neutral-site games).
        const pk = byEvent[ev.id];
        const side = ha => {
          const c = (pk && comp.competitors.find(x => x.team?.displayName === pk[ha]
                       || (pk[ha + "_abbr"] && x.team?.abbreviation === pk[ha + "_abbr"])))
                    || comp.competitors.find(x => x.homeAway === ha) || {};
          return { score: c.score ?? "", logo: c.team?.logo || c.athlete?.flag?.href || "" };
        };
        live[ev.id] = { state: comp.status?.type?.state || ev.status?.type?.state,
                        detail: comp.status?.type?.shortDetail || "", away: side("away"), home: side("home") };
      }
    } catch (e) { /* offline or blocked: cards keep their last state */ }
  }));
  renderGames();
}

/* ---------- Tabs ---------- */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll("main section, .wrap > section").forEach(s => s.hidden = s.id !== b.dataset.tab);
});

renderGames(); renderRecord(); renderHistory(); renderLearning();
poll();
setInterval(poll, 45000);
</script>
